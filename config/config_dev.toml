title = "service config"

[base]
# 运行环境标识（仅用于配置与日志区分）
env = "dev"
# 日志目录
logdir = "/tmp/wssgo/"

[rpc]
# rpc 监听端口
port = 50051
network = "tcp"
registername = "transitData"

[redis]
# 模式：standalone（单机）或 sentinel（哨兵）
mode = "sentinel"
# 哨兵节点地址列表
sentinel_addrs = ["10.130.142.41:26379", "10.130.142.42:26379", "10.130.142.43:26379"]
# 主节点名称
master_name = "mymaster"
password = "my_redis"
db = 0

[http]
# HTTP 服务监听地址
addr = "0.0.0.0:8189"
# 读取请求超时（秒）
read_timeout_sec = 5
# 写响应超时（秒）
write_timeout_sec = 30
# 空闲连接超时（秒）
idle_timeout_sec = 60
# 单次请求体大小上限（字节），1MB = 1048576
max_body_bytes = 1048576

[ws]
# ws 代理请求允许转发的 URL 白名单（精确匹配 scheme+host+path）
allowed_urls = [
    "http://localhost:8189/test",
]
# WebSocket 允许的 Origin 白名单（精确匹配含协议和端口，为空则允许所有来源）
allowed_origins = []

[http.ratelimit]
# 是否启用限流逻辑
enabled = false
# 限流模式：
# dry_run = 命中仅记录日志，不拦截请求（推荐先用）
# enforce = 命中后直接返回 429
mode = "dry_run"
# 限流策略（当前仅支持 fixed_window）
strategy = "fixed_window"
# 限流窗口大小（秒）
window_seconds = 1
# 每个 key 在窗口内允许的最大请求数
max_requests = 30
# 限流维度（当前支持 ip）
key_by = "ip"
