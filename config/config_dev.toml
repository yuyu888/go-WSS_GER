title = "service config"

[base]
env = "dev"
logdir = "/tmp/wssgo/"

[etcd]
server = [
    "172.18.12.229:2379",
    "172.18.12.226:2379",
    "172.18.12.254:2379"
       ]
port = "2379"

[redis]
addr = "172.18.8.205:6384"
password = ""
db = 0

[http]
addr = "0.0.0.0:80"
read_timeout_sec = 5
write_timeout_sec = 30
idle_timeout_sec = 60
max_body_bytes = 1048576

[http.ratelimit]
enabled = false
mode = "dry_run"
strategy = "fixed_window"
window_seconds = 1
max_requests = 30
key_by = "ip"